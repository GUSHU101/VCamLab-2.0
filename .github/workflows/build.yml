name: Build rootless package

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: rootless-package-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  THEOS_COMMIT: 5280bd038207e14f8bd76f5417aa2fe641c03228
  THEOS_SDKS_COMMIT: 0222fd5413cf4b9af096f37b4621afa2688572f7
  THEOS_TOOLCHAIN_URL: https://github.com/L1ghtmann/llvm-project/releases/download/test-210562a/iOSToolchain-x86_64.tar.xz
  THEOS_TOOLCHAIN_SHA256: a72a7a577e2fbe2838b6b5e9c72034fa7d114af96f0e1d4b016f18730ce4056e

jobs:
  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang lld make perl python3 xz-utils dpkg-dev \
            fakeroot file libtinfo6

      - name: Restore pinned Theos environment
        id: theos-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/theos
          key: theos-${{ runner.os }}-${{ runner.arch }}-${{ env.THEOS_COMMIT }}-${{ env.THEOS_SDKS_COMMIT }}-${{ env.THEOS_TOOLCHAIN_SHA256 }}

      - name: Install pinned Theos and iOS SDK
        if: steps.theos-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          THEOS_PATH="$RUNNER_TEMP/theos"
          git clone --filter=blob:none --no-checkout https://github.com/theos/theos.git "$THEOS_PATH"
          git -C "$THEOS_PATH" fetch --depth=1 origin "$THEOS_COMMIT"
          git -C "$THEOS_PATH" checkout --detach "$THEOS_COMMIT"
          git -C "$THEOS_PATH" submodule update --init --recursive --depth=1
          rm -rf "$THEOS_PATH/sdks"
          git clone --filter=blob:none --no-checkout https://github.com/theos/sdks.git "$THEOS_PATH/sdks"
          git -C "$THEOS_PATH/sdks" fetch --depth=1 origin "$THEOS_SDKS_COMMIT"
          git -C "$THEOS_PATH/sdks" checkout --detach "$THEOS_SDKS_COMMIT"
          toolchain_archive="$RUNNER_TEMP/iOSToolchain-x86_64.tar.xz"
          curl --fail --location --retry 3 --output "$toolchain_archive" \
            "$THEOS_TOOLCHAIN_URL"
          printf '%s  %s\n' "$THEOS_TOOLCHAIN_SHA256" "$toolchain_archive" \
            | sha256sum --check --strict
          mkdir -p "$THEOS_PATH/toolchain"
          tar -xJf "$toolchain_archive" -C "$THEOS_PATH/toolchain"

      - name: Verify pinned build environment
        shell: bash
        run: |
          set -euo pipefail
          THEOS_PATH="$RUNNER_TEMP/theos"
          test "$(git -C "$THEOS_PATH" rev-parse HEAD)" = "$THEOS_COMMIT"
          test "$(git -C "$THEOS_PATH/sdks" rev-parse HEAD)" = "$THEOS_SDKS_COMMIT"
          test -x "$THEOS_PATH/toolchain/linux/iphone/bin/clang"

      - name: Validate and compile arm64 plus arm64e
        env:
          THEOS: ${{ runner.temp }}/theos
        run: |
          set -euo pipefail
          python3 scripts/validate_project.py
          make clean
          make package FINALPACKAGE=1 DEBUG=0

      - name: Verify Debian payload
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t packages < <(find packages -maxdepth 1 -type f \
            -name 'com.murkaska.virtualcampro_*_iphoneos-arm64.deb' -print)
          test "${#packages[@]}" -eq 1
          bash scripts/verify_deb.sh "${packages[0]}" "$RUNNER_TEMP/SHA256SUMS"
          {
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'theos=%s\n' "$THEOS_COMMIT"
            printf 'sdks=%s\n' "$THEOS_SDKS_COMMIT"
            printf 'runner=%s\n' "$RUNNER_OS/$RUNNER_ARCH"
            dpkg-deb -f "${packages[0]}" Package Version Architecture
          } > "$RUNNER_TEMP/build-metadata.txt"

      - name: Upload verified rootless package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: VirtualCamPro-rootless
          path: |
            packages/*.deb
            ${{ runner.temp }}/SHA256SUMS
            ${{ runner.temp }}/build-metadata.txt
          if-no-files-found: error
          retention-days: 30
