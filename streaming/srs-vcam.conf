listen              1935;
max_connections     100;
daemon              off;
srs_log_tank        console;

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

vhost __defaultVhost__ {
    tcp_nodelay     on;
    min_latency     on;

    publish {
        mr          off;
    }

    hls {
        enabled             on;
        hls_fragment        1;
        hls_window          4;
        hls_path            ./objs/nginx/html;
        hls_m3u8_file       [app]/[stream].m3u8;
        hls_ts_file         [app]/[stream]-[seq].ts;
        hls_wait_keyframe   on;
        hls_cleanup         on;
        hls_dispose         30;
    }
}
